<!--
===============================================================================
Author: Antonio Corona
Date: 2026-03-14
Project: Web Games Collection
Game: Memory Match
File: memory.html

Description:
This page implements the Memory Match Game interface. The player flips cards
to find matching pairs while tracking time and move count.

Dependencies:
- ../assets/css/style.css  -> Global styling for the game layout
- ../assets/js/memory.js   -> Game logic and card interaction handling

Notes:
- The game board is dynamically generated by memory.js.
- Timer and move counter are updated in real time during gameplay.
===============================================================================
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding for proper text rendering -->
    <meta charset="UTF-8" />

    <!-- Page title displayed in the browser tab -->
    <title>Memory Match Game</title>

    <!-- Shared stylesheet for layout and styling -->
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <div class="page-shell">
      <header class="site-subheader">
        <div class="site-subheader__content">
          <p class="site-subheader__eyebrow">Web Games Collection</p>
          <!-- Page header -->
          <h1 class="site-subheader__title">Memory Game</h1>
          <p class="site-subheader__description">
            Match pairs of cards while tracking your time, moves, and best
            saved performance.
          </p>

          <div class="page-actions">
             <!-- Navigation button to return to the main games menu -->
            <a class="secondary-link-button" href="../index.html">Home Page</a>
          </div>
        </div>
      </header>

      <main class="page-main">
        <div class="page-main__content">

          <!-- Main container for the game interface -->
          <div class="game-container">
            
            <!--
              Persistent performance statistics
              ---------------------------------
              These values are stored in localStorage so returning players
              can see their best performance across sessions.
            -->
            <div class="stats-panel">
              <h2>Best Stats</h2>
              <p>Best Time: <span id="bestTime">--</span></p>
              <p>Best Moves: <span id="bestMoves">--</span></p>
            </div>

            <!-- Displays elapsed game time (updated via JavaScript) -->
            <p>Time: <span id="timer">0</span> seconds</p>

            <!-- Displays the number of player moves -->
            <p>Moves: <span id="moves">0</span></p>

            <!-- 
              Game board container.
              Cards are dynamically created and inserted here by memory.js.
            -->
            <div class="game-board" id="gameBoard"></div>
      
            <!-- Navigation button to reset the memory game -->
            <div class="page-actions">
              <button id="memoryResetButton" type="button">Reset Game</button>
            </div>

            <!--  Win modal - Displayed when the player matches all cards. -->
            <div class="modal-overlay hidden" id="memoryWinModal" aria-hidden="true">
              <div class="modal-card" role="dialog" aria-labelledby="memoryWinTitle" aria-modal="true">
                <h2 id="memoryWinTitle">You Win!</h2>
                <p id="memoryWinMessage">You completed the game.</p>
                <div class="page-actions">
                  <button id="memoryModalNewGameButton" type="button">New Game</button>
                </div>
              </div>
            </div>
            
          </div>
        </div>
      </main>

      <footer class="page-footer">
        <p>Developed by Antonio Corona • Web Games Portfolio Project</p>
      </footer>
    </div>

    <!-- 
      JavaScript file containing the game logic:
      - Card generation
      - Flip mechanics
      - Match detection
      - Timer and move tracking
    -->
    <script src="../assets/js/memory.js"></script>
  </body>
</html>
